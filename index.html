.note-editor .field-input { flex:1; min-height:96px; resize:none; border-radius:0; background:transparent; padding:4px 0; font-size:18px; line-height:1.6; box-shadow:none; }
.note-editor .field-input:focus-visible { background:transparent; }
.field-save { align-self:flex-end; flex:0 0 auto; }
.keyboard-open .sheet.large { padding-bottom:0; }
@media (prefers-reduced-motion:no-preference) { .sheet[open] { animation:surface-reveal .18s cubic-bezier(.16,1,.3,1); } @keyframes surface-reveal { from { opacity:.8; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } } }
@media(hover:hover) { .icon-button:hover,.menu-button:hover,.text-button:hover { background:var(--soft); } }
@media(max-width:760px) {
  .layout { position:fixed; inset:0; height:100dvh; display:block; } .sidebar { display:none; }
  #app>header { position:fixed; top:calc(10px + env(safe-area-inset-top)); left:max(14px,env(safe-area-inset-left)); right:max(14px,env(safe-area-inset-right)); height:62px; min-height:62px; margin:0; padding:8px 12px; z-index:6; }
  #app>header .brand { font-size:1.75rem; }
  main { padding:calc(90px + env(safe-area-inset-top)) 16px var(--dock-reserve); }
  .main-home { display:flex; flex-direction:column; gap:8px; overflow:hidden; scrollbar-gutter:auto; padding-top:calc(90px + env(safe-area-inset-top)); }
  .main-home>.message { flex:0 0 auto; max-height:3.5em; overflow:auto; margin:0; padding-block:8px; }
  .main-home .overview { flex:1 1 auto; min-height:0; gap:10px; }
  .main-home .dual-summary,.main-home .local-status,.main-home .draft-home,.main-home .quick-actions { flex:0 0 auto; }
  .main-home .home-tiles { min-height:0; flex:0 1 auto; grid-auto-rows:minmax(0,1fr); }
  .main-home .home-tile { min-height:66px; }
  .fields,.grid { grid-template-columns:minmax(0,1fr); gap:14px; } .full { grid-column:auto; }
  .panel { padding:20px; border-radius:26px; } .page-title { margin-bottom:18px; }
  .row.wrap { align-items:center; } .actions .button { flex:1 1 130px; } .tools .button { flex:0 1 auto; }
  .bottom { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); align-items:center; gap:3px; position:fixed; left:max(14px,env(safe-area-inset-left)); right:max(14px,env(safe-area-inset-right)); bottom:calc(10px + var(--dock-safe-bottom)); min-height:76px; padding:7px; border:0; border-radius:30px; background:var(--island); box-shadow:var(--island-shadow); backdrop-filter:blur(22px) saturate(130%); z-index:5; }
  .bottom button { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-width:0; min-height:60px; border:0; border-radius:23px; padding:6px 0; background:transparent; color:var(--muted); overflow-wrap:normal; }
  .bottom .nav-label { display:none; } .bottom button.active { background:var(--soft); color:var(--ink); }
  .bottom button.active .nav-label { display:block; white-space:nowrap; font-size:.68rem; line-height:1.2; }
  .bottom button.active svg { width:26px; height:26px; }
  .sheet.large { position:fixed; left:12px; top:calc(var(--viewport-top,0px) + env(safe-area-inset-top) + 12px); width:calc(100% - 24px); height:calc(var(--viewport-height,100dvh) - env(safe-area-inset-top) - 24px); max-height:calc(var(--viewport-height,100dvh) - env(safe-area-inset-top) - 24px); margin:0; border-radius:30px; padding-bottom:env(safe-area-inset-bottom); }
  .sheet.compact { position:fixed; inset:auto 12px calc(12px + env(safe-area-inset-bottom)); width:calc(100% - 24px); max-height:calc(var(--viewport-height,100dvh) - env(safe-area-inset-top) - 24px); margin:0; border-radius:28px; }
  .focus-mode .sheet.compact { bottom:auto; top:calc(var(--viewport-top,0px) + env(safe-area-inset-top) + 24px); }
  .sheet-head { padding:10px 12px; gap:8px; } .sheet-head h2 { font-size:1.15rem; } .sheet-head .brand-home { font-size:.95rem; }
  .sheet-body { padding:12px 16px 20px; }
  .operation-row { grid-template-columns:24px minmax(0,1fr); gap:6px 10px; } .op-icon { grid-column:1; grid-row:1/3; } .op-amount { grid-column:2; text-align:left; }
  .auth { margin:0 auto; padding:18px 14px; } .auth .panel { padding:22px; } .auth .fields { gap:14px; }
  .keyboard-open .bottom { display:none; } .keyboard-open main { padding-bottom:24px; } .local-status { touch-action:pan-y; }
}
@media(max-width:360px) {
  #app>header { left:10px; right:10px; padding-inline:8px; gap:4px; } #app>header .brand { font-size:1.5rem; }
  .header-actions { gap:0; } .menu-button { padding-inline:8px; gap:4px; } main { padding-inline:12px; }
  .bottom { left:10px; right:10px; gap:0; padding:5px; } .bottom button.active .nav-label { font-size:.62rem; }
  .home-tile { padding:12px; } .quick-action { font-size:.78rem; gap:4px; } .sheet-head .brand-home { font-size:.85rem; }
}
@media(max-width:760px) and (max-height:740px) {
  main,.main-home { padding-top:calc(82px + env(safe-area-inset-top)); padding-bottom:calc(92px + var(--dock-safe-bottom)); }
  .main-home .overview { gap:6px; }
  .main-home .home-tile { min-height:48px; padding:8px 12px; gap:3px; }
  .main-home .home-tile span { font-size:.75rem; }
  .main-home .home-tile strong { font-size:1rem; }
  .main-home .summary-main { min-height:68px; padding:0 10px 8px; }
  .main-home .free-row { min-height:58px; padding:8px 14px; }
  .main-home .dual-summary { padding:10px; }
  .main-home .quick-action { min-height:44px; padding:8px 4px; }
  .overview { gap:8px; } .dual-summary { padding:12px 10px 10px; border-radius:26px; } .summary-main { min-height:82px; padding-bottom:12px; }
  .big { font-size:1.9rem; } .free-row { min-height:68px; padding:12px 16px; } .free-row strong { font-size:1.25rem; }
  .home-tile { min-height:72px; padding:12px; gap:6px; } .home-tile strong { font-size:1.08rem; } .quick-action { min-height:48px; }
}
@media(prefers-reduced-motion:no-preference) { .button,.icon-button,.menu-button,.circle-action,.nav button,.bottom button { transition:background-color .15s,color .15s; } }
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; scroll-behavior:auto!important; } }

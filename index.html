.filter-date-error:empty { display:none; }
.filter-check { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:48px; padding:8px 0; line-height:1.3; font-size:.9375rem; color:var(--ink); }
.filter-check span { min-width:0; overflow-wrap:anywhere; }
.filter-check input { width:22px; height:22px; min-height:0; flex-shrink:0; accent-color:var(--action); margin:0; padding:0; appearance:auto; -webkit-appearance:auto; }
.filter-all { background:transparent; color:var(--muted); min-height:44px; border:0; padding:8px 0; text-align:left; }
.filter-all[aria-pressed=true] { color:var(--blue); font-weight:600; }
.filter-group summary { display:flex; align-items:center; gap:8px; min-height:44px; font-size:1.0625rem; font-weight:600; list-style:none; color:var(--ink); }
.filter-group summary::-webkit-details-marker { display:none; }
.filter-group summary span { margin-left:auto; color:var(--muted); font-weight:400; font-size:.82rem; min-width:0; }
.filter-group summary svg { width:18px; height:18px; transform:rotate(90deg); }
.filter-group details[open] summary { margin-bottom:10px; }
.filter-group details[open] summary svg { transform:rotate(-90deg); }
.filter-actions { display:grid; gap:8px; }
.filter-actions button { min-height:52px; border:0; border-radius:20px; background:transparent; color:var(--blue); padding:12px; }
.filter-actions .filter-apply { background:var(--action); color:#fff; font-weight:600; }
.filter-search-summary { display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; min-height:48px; margin:0 0 16px; padding:12px 16px; border:0; border-radius:20px; background:var(--soft); color:var(--ink); text-align:left; font-size:.875rem; }

/* Shared long-press bubble. No parent-page geometry changes. */
.context-surface { position:fixed; inset:0; margin:0; width:100vw; height:100dvh; max-width:none; max-height:none; border:0; padding:0; background:transparent; color:var(--ink); overflow:hidden; touch-action:auto; }
.context-surface::backdrop { background:transparent; backdrop-filter:none; -webkit-backdrop-filter:none; }
.context-options { position:fixed; padding:6px; border-radius:22px; background:light-dark(#ffffffeb,#34363feb); color:var(--ink); box-shadow:0 8px 24px light-dark(#1c223424,#0007); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); overflow-y:auto; overscroll-behavior:contain; }
.context-options button { display:flex; align-items:center; justify-content:space-between; gap:14px; min-height:48px; width:100%; padding:10px 13px; border:0; border-radius:16px; background:transparent; color:var(--ink); text-align:left; font-size:.9375rem; line-height:1.35; touch-action:none; }
.context-options button span { min-width:0; overflow-wrap:anywhere; }
.context-options button.danger { color:var(--expense); }
.context-options button.context-selected,.context-options button:focus-visible { background:var(--soft); }
.context-options svg { width:20px; height:20px; }
.context-options.context-scrollable,.context-options.context-scrollable button { touch-action:pan-y; }
[data-operation],[data-account-view],[data-category-view],[data-draft],[data-child],[data-cat-operation],[data-account-operation],[data-metric-operation],[data-result-kind],[data-tile] { -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; }
.category-row { display:block; }
.category-row .list-button { margin:0; background:var(--white); }
.sheet:has(.sheet-more) .sheet-head { display:grid; grid-template-columns:44px minmax(0,1fr) 44px; gap:4px; }
.sheet:has(.sheet-more) .sheet-head h2 { text-align:center; }
.sheet[data-operation-chooser] .sheet-head { display:flex; justify-content:space-between; gap:12px; }
.sheet[data-operation-chooser] .sheet-head h2 { margin-right:auto; }
.sheet[data-operation-chooser] .sheet-close { flex:0 0 44px; }

/* Full pages have no outer card or safe-area masking strip. Only the island floats. */
.sheet.large { position:fixed; inset:var(--viewport-top,0px) 0 auto; width:100%; max-width:none; height:var(--viewport-height,100dvh); max-height:var(--viewport-height,100dvh); margin:0; padding:0; border:0; border-radius:0; background:var(--canvas); animation:none; transform:none; box-shadow:none; }
.sheet.large::backdrop { background:transparent; }
.sheet.large .sheet-head { top:calc(10px + env(safe-area-inset-top)); left:max(14px,env(safe-area-inset-left)); right:max(14px,env(safe-area-inset-right)); min-height:62px; background:var(--island); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
.sheet.large .sheet-body { padding-top:calc(var(--sheet-head-height,62px) + env(safe-area-inset-top) + 30px); padding-bottom:calc(24px + env(safe-area-inset-bottom)); }
.sheet.large .sheet-body>.list-button,.sheet.large .operation-money,.sheet.large .split-summary,.sheet.large .split-amount-card,.sheet.large .split-item,.sheet.large .split-choice,.sheet.large .transfer-account,.sheet.large .pick-button { background:var(--white); }
.sheet-head h2 { background:transparent; backdrop-filter:none; }
.focus-mode .sheet.large .sheet-head { background:var(--island); }
button:focus,a:focus,summary:focus,input:focus,textarea:focus,select:focus { outline:none; }
.context-surface { z-index:100; }

.auth form>.button { margin-top:16px; }

/* PATCH 2.1: one state vocabulary across existing FinRate controls. */
:root {
 --menu-surface:light-dark(#fff,#34363f);
 --menu-selected:light-dark(#d1dce9,#626d82);
 --control-pressed:var(--soft);
 --keyboard-state:light-dark(#d9e5f3,#465168);
 --field-text-size:1.125rem;
}
/* Focus is visible by a filled state, never an extra white outline. */
:is(button,a,summary,input,textarea,select):focus,
body.keyboard-navigation :is(button,a,summary,input,textarea,select):focus-visible { outline:0; outline-offset:0; box-shadow:none; }
body.keyboard-navigation :is(button,a,summary,select,.field-launcher):focus-visible { background-color:var(--keyboard-state); text-decoration:underline; text-underline-offset:4px; }
:is(button,a,summary):active { filter:brightness(.92); }
.context-options { background:var(--menu-surface); }
.context-options button:focus-visible { background:transparent; }
body.keyboard-navigation .context-options button:focus-visible { background:transparent; text-decoration:none; }
.context-options button.context-selected,
body.keyboard-navigation .context-options button.context-selected:focus-visible { background:var(--menu-selected); }
.context-options button:disabled { color:var(--muted); opacity:.65; }
.field-editor .sheet-head { display:grid; grid-template-columns:44px minmax(0,1fr) auto; }
.field-editor .sheet-head h2 { text-align:center; }
.field-done { min-height:44px; padding:8px; color:var(--blue); font-weight:600; white-space:nowrap; }
.field-editor .field-input,.field-editor .field-input:focus,.field-editor .field-input:focus-visible { flex:1; min-height:44px; width:100%; margin:0; padding:8px 2px; border:0; border-radius:0; outline:0; box-shadow:none; background:transparent; color:var(--ink); font-size:var(--field-text-size); line-height:1.65; }
.field-editor input.field-input { flex:0 0 auto; font-size:1.75rem; white-space:nowrap; overflow-x:auto; }
.field-editor textarea.field-input { resize:none; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; }
.field-editor .sheet-body { min-height:0; overflow:hidden; }
.field-editor .value-form { min-height:0; height:100%; margin:0; }
.field-launcher { cursor:pointer; }
.full-note { white-space:pre-wrap; overflow-wrap:anywhere; max-height:min(40dvh,360px); overflow-y:auto; overscroll-behavior:contain; padding-block:4px; line-height:1.6; user-select:text; -webkit-user-select:text; }
.pick-button strong,.list-button strong,.op-description { min-width:0; }
.pick-button strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.op-description strong { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.money-value { display:inline-block; max-width:100%; min-width:0; vertical-align:bottom; white-space:nowrap; overflow-x:auto; overflow-y:hidden; overflow-wrap:normal; word-break:normal; font-variant-numeric:tabular-nums; scrollbar-width:thin; touch-action:auto; }
.money-value:focus-visible { background:var(--keyboard-state); text-decoration:underline; text-underline-offset:4px; }
.big,.card-amount,.op-amount,[data-amount-value],.signed-input,.home-tile strong,.split-live strong,.split-remaining,.detail-row strong { min-width:0; max-width:100%; white-space:nowrap; overflow-wrap:normal; }
.summary-main,.home-tile,.operation-row,.detail-row,.transfer-account,.split-item,.split-live>div,.list-button>span,.operation-amount { min-width:0; max-width:100%; }
.op-amount { max-width:48%; flex-shrink:1; }
.signed-input { display:flex; align-items:center; gap:8px; }
.signed-input [data-amount-value] { flex:1; overflow:hidden; }
.signed-input>svg { flex-shrink:0; }
.detail-row>span { min-width:0; }
.detail-row strong { max-width:60%; }
.transfer-account small { display:block; min-width:0; max-width:100%; }
button:disabled .money-value { pointer-events:none; }
.context-options button { position:relative; padding-left:19px; }
.context-options button.context-selected::before { content:""; position:absolute; left:6px; top:50%; transform:translateY(-50%); width:3px; height:20px; border-radius:2px; background:currentColor; }
.field-count { flex:0 0 auto; padding:4px 2px; color:var(--muted); }
:root { --danger-selected:light-dark(#f8d6db,#5c2630); }
.context-options button.danger.context-selected,
body.keyboard-navigation .context-options button.danger.context-selected:focus-visible { background:var(--danger-selected); }
.filter-segments button[aria-pressed=true] { background:var(--menu-selected); box-shadow:none; font-weight:600; text-decoration:underline; text-underline-offset:4px; }
.money-value:focus,.context-surface:focus { outline:0; box-shadow:none; }

#category-results { display:grid; gap:12px; margin-top:18px; }
#category-results .category-row { margin:0; }
#toggle-sort { width:auto; max-width:100%; margin:0; }

/* Shared archive action identity, using the existing brand text token. */
:root { --archive-selected:light-dark(#dceaff,#24436a); }
.archive-action,.context-options button.archive-action { color:var(--blue); }
.context-options button.archive-action.context-selected,

.subcategory-results { display:grid; gap:12px; margin-block:18px; }
.subcategory-results .list-button { margin:0; }
#balance-date[hidden] { display:none; }

/* Context creation is distinct from the blue financial operation launcher. */
.context-plus { background:var(--field); color:var(--blue); border:1.5px solid var(--blue); }

.operation-edge[data-side=left] { left:0;right:auto;border-radius:0 10px 10px 0; }
.operation-edge[data-side=left]::before { inset:0 -26px 0 0; }
.edge-preview[data-side=left] { left:12px;right:auto;transform:translate(calc((1 - var(--pull))*-240px),-50%); }
.sheet.side-chooser[data-side=left] { left:12px;right:auto; }

/* One shared wizard surface; separate selectable cards and final result. */
.merge-flow { display:grid;gap:20px;padding-bottom:24px; }
.merge-flow label { margin:0; }
.merge-option-list { display:grid;gap:12px; }
.merge-option { display:flex;align-items:center;gap:14px;background:var(--white);border-radius:24px;padding:16px;min-height:64px; }
.merge-option input[type=checkbox] { width:22px;height:22px;flex:0 0 22px;margin:0;accent-color:var(--blue); }
.merge-option span { min-width:0;overflow-wrap:anywhere; }
.merge-option small { display:block;color:var(--muted);margin-top:4px; }
.merge-unavailable { opacity:.6; }
.merge-selection-summary { display:flex;align-items:center;justify-content:space-between;gap:12px; }
.merge-collision { display:grid;gap:16px;padding-block:12px; }
.merge-result-card { background:var(--white);border-radius:26px;padding:22px;display:grid;gap:16px; }
.merge-result-children { display:grid;gap:12px; }
.merge-result-card dl { margin:0; }
.merge-step-actions { display:grid;gap:16px;margin-top:8px; }
.merge-step-actions .text-button { justify-self:start; }

.sheet[data-merge-wizard]>.merge-step-actions { flex:0 0 auto;margin:0;padding:12px 20px calc(8px + env(safe-area-inset-bottom));gap:4px;background:var(--canvas); }

/* Shared shell geometry. The status area is canvas, never a blurred full-width bar.

 content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px);

}

 gap:4px; border-radius:28px; background:var(--island);

 -webkit-backdrop-filter:blur(22px) saturate(120%);
}
.sheet.large .sheet-head { left:var(--island-gutter); right:var(--island-gutter); }
#app>header>h1,.sheet .sheet-head h2 {
 font-size:1.15rem; line-height:1.2; margin:0; padding-block:0;
 max-height:44px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
}
.sheet.large .sheet-body { padding-inline:var(--page-gutter); }
.stack,.fields,.grid,.filter-form { gap:var(--peer-gap); }
.pick-button { margin-block:var(--peer-gap); }
.panel { margin-bottom:var(--group-gap); }
#category-results,.subcategory-results { gap:var(--peer-gap); }

 main { padding-inline:var(--page-gutter); }

}

 :root { --page-gutter:max(12px,env(safe-area-inset-left),env(safe-area-inset-right)); --island-gutter:max(10px,env(safe-area-inset-left),env(safe-area-inset-right)); }

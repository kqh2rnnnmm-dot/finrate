<section class="help-section"><h2>Финансовая модель B1</h2><details open><summary>Фактический остаток и пять режимов свободных денег</summary><div><p>Фактический остаток — ваши собственные деньги. Кредитный долг не вычитается, неиспользованный лимит не прибавляется. Собственные средства, оставленные после возврата на кредитке, входят в остаток.</p><p>Период на Главной и в «Настройки → Финансовое планирование» общий и сохраняется сразу после выбора. При первом запуске выбран текущий месяц. Нажмите «Свободные деньги»: текущий месяц вычитает известные ещё не погашенные суммы и просрочки без будущей зарплаты. Прогноз на 2, 3 или 4 месяца включает остаток текущего месяца и следующие месяцы, а также настроенные ожидаемые доходы. «Все долги» вычитает уже возникшие учтённые долги независимо от срока, без будущих услуг и доходов. Отрицательное число показывает нехватку денег.</p><p>Прогноз пока неполный: регулярные расходы, личные долги и резервы ещё не подключены. Возможный дефицит до конечной даты показан отдельно.</p></div></details><details><summary>Как настроить доходы и избежать удвоения?</summary><div><p>Настройки → Финансовое планирование → «Добавить доход». Планы видны сразу, период расчёта находится внизу. Тап по плану открывает карточку с отдельным синим «Изменить» под каждым значением. Долгое нажатие открывает меню: «Дублировать», «Архивировать», «Удалить план». Можно выбрать пункт движением пальца и отпусканием или отдельным тапом. Копия не сохраняется до подтверждения; история, фактические доходы и связи в неё не копируются. Архив отключает будущие поступления и позволяет восстановить план без начисления за время паузы. При архивировании и удалении выберите, оставить прошлые поступления ожидаемыми или закрыть без поступления. Записанные операции сохраняются. Последовательно укажите сумму за одно поступление, категорию и подкатегорию, периодичность и счёт зачисления. Категории, подкатегории и счета общие с обычными операциями; создать недостающие можно прямо при выборе. Периодичность: каждый день, неделю, месяц или год. Начало учёта — день создания; прошлые даты автоматически не добавляются. Зарплату и аванс настройте как два дохода, без третьей полной зарплаты.</p><p>Любое поступление записывайте через «+ → Доход». Если есть незакрытые плановые поступления, выберите карточку либо «Другой доход». Если их нет — сразу откроется обычная форма. «Подтвердить по плану» записывает оставшуюся сумму на выбранный счёт сегодняшней датой. Через «Скорректировать» измените сумму, фактическую дату или счёт. При меньшей сумме укажите, ожидается ли остаток. Большая сумма целиком входит в факт, план будущих месяцев не меняется. Если доход уже записан, используйте «Связать с записанным доходом»: второго зачисления не будет.</p><p>Пропущенные поступления остаются отдельными карточками. «Закрыть без поступления» убирает только эту дату, комментарий необязателен. Следующие поступления сохраняются. История изменений плана сохраняется внутри защищённой базы, но её просмотр пока скрыт. Новые регулярные планы учитывают незакрытые задержанные поступления в прогнозах на 2–4 месяца; текущий месяц и «Все долги» будущие доходы не прибавляют. Если числа нет в месяце — последний день месяца, включая 29 февраля. Изменение расписания действует с текущей даты и не переписывает прежние даты и подтверждения. Удаление плана отключает будущее, сохраняя операции и прошлые незакрытые поступления.</p></div></details><details><summary>Что делать с возвратом на погашенную кредитку?</summary><div><p>Возврат уменьшает сначала долг исходной покупки, затем остальные долги. Излишек можно оставить собственными средствами на кредитке: следующие покупки сначала тратят их, затем кредит. Сам лимит банка не увеличивается. Возврат уменьшает расходы и не считается заработанным доходом.</p><p>Либо выберите дебетовый счёт и подтвердите, что излишек действительно переведён в дату операции. До реального перевода не подтверждайте зачисление. Если ещё не решили — «Сохранить черновик». Черновик не меняет показатели, сохраняется на устройстве, не блокирует карту или другие операции. Продолжить или удалить его можно в «Черновиках»; при завершении расчёт проверяется заново.</p><p>Обычное пополнение карты не может превышать долг. Нельзя отменить старую покупку так, чтобы её погашение превратилось в произвольную переплату; сначала исправьте связанные записи. Если возврат и реальный вывод сделаны в разные дни, сохраните возврат с вариантом «Оставить», затем запишите фактический перевод собственных средств на дебет отдельной датой.</p></div></details><details><summary>Меняются ли старые сроки при смене настроек карты?</summary><div><p>Нет. Новые правила применяются к новым покупкам. Срок уже записанной покупки сохраняется; его явное изменение показано в истории «было → стало». Погашение закрывает ближайшие сроки, просроченные — первыми. Выписка — контрольная информация, не второй долг. Проценты и банковские минимальные платежи не начисляются автоматически.</p></div></details><details><summary>Нужен ли сброс для B1?</summary><div><p>Автоматического сброса нет. Обычные совместимые документы R30 преобразуются при открытии с сохранением исходной защищённой версии перед первым сохранением. Неподдерживаемая переплата или долг без срока требуют отдельного разбора: база не стирается. До обновления сохраните защищённую копию. R30 не читает новый формат B1.</p></div></details></section><section class="help-section"><h2>С чего начать</h2><ol><li>Создайте защищённую базу и сохраните ключ восстановления отдельно от резервной копии.</li><li>В разделе «Счета и кошельки» добавьте ваши реальные счета и укажите их текущие остатки.</li><li>Записывайте покупки, поступления и переводы через кнопку операций. Выберите дату, счёт, сумму и при желании категорию.</li><li>Сделайте защищённую копию через «Данные и синхронизация» и проверьте, что файл сохранился.</li></ol><p>Суммы с подписью «Пример» служат подсказкой: в поле ещё ничего не введено.</p></section>
<section class="help-section"><h2>Счета и остатки</h2><details><summary>Что вводить при добавлении счёта?</summary><div><p>Введите сумму, которая находится на счёте сейчас. Это исходная точка учёта. Для кредитной карты отдельно вводится уже существующий долг банку положительным числом без знака минус.</p><p>«Начальный остаток» в карточке показывает ту исходную точку, а «Текущий остаток» учитывает все записанные после неё операции.</p></div></details><details><summary>Как исправить остаток?</summary><div><p>Откройте счёт → «Редактировать» → «Изменить остаток». Для обычного счёта текущая сверка создаст корректировку разницы, которая не считается доходом или расходом. Изменение начального остатка пересчитает текущий результат.</p><p>На кредитном счёте новый долг добавляется расходом с датой и сроком возврата; не создавайте его сверкой остатка. Пополнение долга выполняйте переводом на кредитный счёт.</p></div></details></section>
<section class="help-section"><h2>Кредитная карта</h2><details open><summary>Как завести карту с уже существующим долгом?</summary><div><ol><li>Выберите кредитный тип и укажите лимит банка.</li><li>Введите сумму, которую уже должны банку, без знака минус. Пустое поле означает, что долга пока нет.</li><li>Выберите правило срока новых покупок: по месяцам, по числу дней либо по выписке.</li><li>На следующем шаге распределите <strong>весь</strong> текущий долг: для каждой части укажите сумму и точный срок по выписке или месяц прежней покупки. Нажатие на «Осталось распределить» подставляет остаток в сумму следующей части, но не добавляет её и не сохраняет счёт. Сохранение доступно, когда осталось распределить ноль.</li></ol><p>Лимит — сколько банк разрешает занять. Долг — сколько уже занято. Доступная сумма меняется при покупках и пополнениях; долг помечен фиолетовым.</p></div></details><details><summary>Я забыл расход из прошлого месяца. Как его добавить?</summary><div><p>Создайте обычную операцию «Расход», выберите кредитную карту и поставьте фактическую дату старой покупки. При режиме по месяцам или дням срок этой покупки рассчитается от её даты. В режиме выписки укажите точный срок возврата в поле операции. Долг попадёт в соответствующий срок; повторно вводить всю исходную сумму не нужно.</p><p>Перед переносом из R30 долг без сроков необходимо распределить в R30. После переноса сверьте старые даты с выпиской: B1 фиксирует то, что рассчитывала R30 на момент переноса, и не восстанавливает утраченные старые условия.</p></div></details><details><summary>Как считается срок покупок?</summary><div><p>При правиле «По месяцам» покупки одного календарного месяца получают одинаковый срок — конец выбранного месяца после месяца покупки. Например, при правиле «до конца третьего месяца» покупки октября надо вернуть до 31 января. При правиле «Точное число дней» срок считается от даты каждой покупки. При режиме «По выписке» срок указываете сами.</p><p>Настоящая дата банка может зависеть от условий карты. Проверьте расчёт по выписке и при необходимости укажите её дату прямо в операции.</p></div></details><details><summary>Как погасить долг полностью или частично?</summary><div><p>Сделайте перевод с наличных или другого счёта <strong>на кредитную карту</strong>. Пополнение гасит сначала самый ранний непогашенный срок, затем следующий. Если в октябре нужно вернуть 10 000 ₽, а в ноябре ещё 10 000 ₽, перевод 7 000 ₽ оставит октябрьский долг 3 000 ₽. Перевод 15 000 ₽ закроет октябрь и уменьшит ноябрьский долг до 5 000 ₽.</p><p>Перевод не является доходом. Обычный перевод не может превышать общий долг. Собственные средства возникают только из излишка подтверждённого возврата покупки.</p></div></details><details><summary>Что делать с переводом с кредитки или комиссией?</summary><div><p>Выберите срок возврата кредитных средств в операции, когда она использует лимит. Банк может не давать льготный период на такие операции. Сумму платежа по выписке можно дополнительно уточнить в карточке счёта; это уточнение не заменяет распределение долга по срокам.</p></div></details></section>
<section class="help-section"><h2>Операции и категории</h2><details><summary>Расход, доход или перевод?</summary><div><p>Покупка и комиссия — расход; заработанные или полученные деньги — доход. Перемещение между своими счетами, включая погашение кредитки, — перевод: деньги списываются с одного и поступают на другой, без нового дохода или расхода.</p><p>В операции можно поставить прошлую дату, добавить примечание и распределить покупку по нескольким категориям.</p></div></details><details><summary>Как работать с категориями и подкатегориями?</summary><div><p>Откройте «Категории», выберите тип операций и нажмите на категорию: под ней раскроется список подкатегорий. Кнопка создания находится над списком. Значок редактирования рядом с категорией открывает её настройки; подкатегорию можно открыть прямо из списка. Для доходов и расходов списки раздельные.</p></div></details><details><summary>Как найти и исправить запись?</summary><div><p>Откройте «Операции» или поиск, найдите запись по дате и названию, затем используйте действия в её карточке. Изменения отражаются в остатках и истории. Возврат покупки привязывается к исходному расходу; отмена и архивирование доступны в соответствующих карточках, когда это позволяет состояние записи.</p></div></details></section>
<section class="help-section"><h2>Данные и доступ</h2><details><summary>Где хранятся мои данные?</summary><div><p>База хранится на этом устройстве в браузере. Пароль защищает её локально. Очистка данных сайта может удалить базу, поэтому регулярно сохраняйте защищённую копию отдельно. Раздел «Данные и синхронизация» позволяет создать или восстановить такую копию; автоматической облачной синхронизации здесь нет.</p></div></details><details><summary>Что делать, если забыл PIN?</summary><div><p>Войдите с основным паролем или ключом восстановления. PIN — быстрый способ входа на этом устройстве; он не заменяет пароль и резервную копию.</p></div></details></section>
<section class="help-section"><h2>Главная и меню операций</h2><details><summary>Как настроить блоки?</summary><div><p>Нажмите «Настроить блоки» на Главной. Доступны 1–6 блоков и три прежних вида: числа, подробности и строки. Блоки помещаются на экран без отдельной прокрутки; при нехватке высоты второстепенные подписи сокращаются, подробности открываются по нажатию на блок. Долгое нажатие на «Главная» в нижней панели и настройка через «Настройки» также сохранены.</p></div></details><details><summary>Где создать операцию?</summary><div><p>Верхний «+» и боковая ручка открывают одно меню «Новая операция» с расходом, доходом и переводом. Верхнее меню располагается под заголовком, боковое — по центру с равными отступами. Закрыть можно крестиком, касанием снаружи или возвратом; боковую ручку можно потянуть обратно.</p></div></details></section><section class="help-section"><h2>Примечания и ввод</h2><details><summary>Как прочитать и изменить примечание?</summary><div><p>Нажмите «Примечание · Просмотреть» в карточке операции или счёта. Полный текст открывается без клавиатуры; его можно выделить и скопировать. «Редактировать» открывает общий редактор с чёткой рамкой и кнопкой со встречными диагональными стрелками: она разворачивает и сворачивает область текста, сохраняя текст, курсор и прокрутку. «Сохранить» принимает текст. «Отмена» при изменениях предлагает продолжить, сохранить или выйти без сохранения. В форме изменения остаются в черновике до сохранения самой формы. Прежние значения в истории доступны только для чтения. Редактор занимает пространство над клавиатурой; прокручивается сам текст. Короткий свайп вниз в начале текста или касание свободного места у счётчика скрывает клавиатуру без сохранения. Для продолжения коснитесь нужного места текста. Панель со стрелками и галочкой над клавиатурой принадлежит iOS. Штатного способа убрать её в PWA нет; она не сохраняет примечание. В развёрнутом режиме счётчик помещается в строку кнопки, освобождая место для текста.</p></div></details><details><summary>Как завершить ввод суммы?</summary><div><p>Введите сумму вместо выделенного значения и нажмите «Готово». Это принимает поле, но не проводит операцию. Дробную часть можно вводить через запятую или точку.</p></div></details></section><section class="help-section"><h2>Оформление и уведомления</h2><details><summary>Как включить цветную палитру?</summary><div><p>Настройки → Внешний вид → «Цветовая палитра»: Нейтральная или Цветная. Отдельная «Тема» задаёт Как в системе, Светлая или Тёмная. Сохраните настройки. В режиме «Как в системе» оттенки меняются вместе с устройством без перезагрузки. Цвета «Фактического остатка» и «Свободных денег» выбираются отдельно, прежние значения сохраняются.</p><p>В старых копиях без выбора палитры используется Нейтральная. После повторного входа восстанавливается сохранённый выбор; до расшифровки базы при новом запуске применяется нейтральное оформление.</p></div></details><details><summary>Чем отличаются уведомления?</summary><div><p>Финансовое сообщение появляется после подтверждённой записи. Тап открывает снимок именно сохранённого действия: тип, сумму, счёт и дату. Изменить запись из сообщения нельзя. В подробностях фон заблокирован; крестик или тап снаружи закрывают их. Свайп вверх убирает компактное сообщение. Если подлинных подробностей операции нет, показывается обычное системное подтверждение.</p><p>Системные сообщения компактны, находятся под верхним островом и исчезают автоматически. Очередь не выполняет финансовых действий повторно. Сообщения внутри открытого FinRate не являются push и не доставляются при закрытом приложении.</p></div></details><details><summary>Как отключить уведомления?</summary><div><p>В Настройках можно независимо отключить финансовые или системные уведомления, либо выключить «Обычные уведомления» целиком. Две частные настройки сохраняются при общем отключении. Ошибки сохранения и обязательные предупреждения безопасности остаются доступными. Ошибка записи не исчезает по таймеру:

.sidebar .nav-label,.op-description>strong,.op-description>small { display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }

/* D1: the Home grid owns the remaining screen height, not a scroll area. */
.main-home { display:flex; flex-direction:column; overflow:hidden; }
.main-home .home-screen { flex:1 1 0; min-height:0; margin:0 auto; gap:var(--peer-gap); }
.home-status-row { display:flex; align-items:center; gap:var(--peer-gap); flex:0 0 auto; min-height:44px; }
.home-status-row .local-status { flex:1; min-width:0; font-size:.75rem; }
.home-config-button { display:inline-flex; align-items:center; gap:6px; flex-shrink:0; font-size:.75rem; }
.home-config-button .app-icon { width:18px; height:18px; }
.main-home .home-tiles[class*="tiles-"] { flex:1 1 0; min-height:0; max-height:none; grid-template-columns:repeat(var(--home-columns,2),minmax(0,1fr)); grid-template-rows:repeat(var(--home-rows,3),minmax(0,1fr)); grid-auto-rows:minmax(0,1fr); align-content:stretch; overflow:hidden; gap:var(--peer-gap); }
.main-home .home-tiles[data-columns="3"] .home-tile { grid-column:auto; }
.home-tile,.main-home .home-tile { min-height:110px;gap:5px;padding:14px;justify-content:center; }
.home-tile .tile-caption,.main-home .home-tile .tile-caption { display:flex;align-items:flex-start;gap:6px;min-width:0;font-size:.875rem;line-height:1.25;color:var(--muted);white-space:normal;word-break:normal;overflow-wrap:normal; }
.home-tile .tile-caption>span { font:inherit;color:inherit; }
.tile-kind { display:inline-flex;flex:0 0 18px; }
.tile-kind .app-icon { width:18px;height:18px; }
.tile-kind.expense { color:var(--expense)!important; }.tile-kind.income { color:var(--income)!important; }.tile-kind.transfer { color:var(--transfer)!important; }
.home-tile .tile-value,.main-home .home-tile .tile-value { display:block;font-size:1.875rem;font-weight:600;line-height:1.2;max-width:100%;min-width:0; }
.home-tile .tile-value .money-value { font:inherit;line-height:inherit;color:inherit; }
.home-tile.tile-half .tile-value { font-size:1.625rem; }
.home-tile .tile-context,.main-home .home-tile .tile-context { display:block;max-width:100%;min-width:0;font-size:.8125rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.home-tile .tile-meta,.main-home .home-tile .tile-meta { font-size:.75rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
[data-home-style=details] .home-tile { min-height:138px;gap:4px; }
.tile-facts { display:grid;gap:4px;min-width:0; }
.tile-facts:empty { display:none; }
.home-tile .tile-facts>span { display:flex;justify-content:space-between;gap:8px;min-width:0;font-size:.75rem;line-height:1.3; }
.tile-facts>span>span { white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0; }

[data-home-style=rows] .home-tile { display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;min-height:86px; }
.tile-lead { grid-row:1/4;align-self:center;color:var(--muted); }

[data-home-style=rows] .tile-half .tile-lead { display:none; }
.home-tile .tile-value.tile-status,.main-home .home-tile .tile-value.tile-status { font-size:1rem;font-weight:500;white-space:normal; }
#home-config-form,#home-tile-form { display:grid;gap:14px; }

 .main-home .tile-context { display:none; }

.draft-row>.list-button { flex:1; min-width:0; }

/* Reversible archiving keeps its established menu fill; the action is red. */
button.archive-action,.context-options button.archive-action { color:var(--blue); }

/* R28: credit markers and additive Home density rules. */
:root { --credit-ink:light-dark(#704291,#d8b6f0); }
.credit-mark { display:inline-flex;align-items:center;gap:6px;color:var(--credit-ink)!important;max-width:100%;min-width:0;vertical-align:middle; }
.credit-mark>.app-icon { width:18px;height:18px;flex:0 0 18px; }
.credit-mark>span { min-width:0; }
.credit-amount { color:var(--credit-ink)!important; }
.credit-policy-fields { display:grid;gap:12px; }
.credit-policy-fields[hidden] { display:none; }
.credit-account-details details,.transfer-balance-details { margin-block:18px; }
.credit-account-details summary,.transfer-balance-details summary { min-height:44px;display:flex;align-items:center; }

/* R30: shared peer spacing and inline category disclosure. */
.menu-items,#account-results,.opening-allocation,.category-child-list,.help-page { display:grid;gap:var(--peer-gap); }
.menu-items>.list-button,#account-results>.list-button,.category-child-list>.list-button { margin:0; }

.category-children { padding:0 12px 12px;display:grid;gap:var(--peer-gap); }

.category-children>.button { justify-self:stretch; }
.opening-allocation { padding-bottom:var(--peer-gap); }
.opening-allocation form { display:grid;gap:var(--peer-gap); }
.opening-allocation form>label { margin:0; }

.opening-part { display:flex;align-items:center;justify-content:space-between;gap:var(--peer-gap);background:var(--white);border-radius:16px;padding:8px 12px;min-height:58px; }
.opening-part span { min-width:0;overflow-wrap:anywhere; }
.help-page { padding-bottom:var(--group-gap); }
.help-section { padding:18px;background:var(--white);border-radius:24px;display:grid;gap:var(--peer-gap); }
.help-section>h2 { margin:0; }
.help-section>details { border-radius:16px;background:var(--soft);padding:0 14px; }
.help-section summary { cursor:pointer;min-height:54px;display:flex;align-items:center;line-height:1.4;font-weight:600; }
.help-section details>div { padding:0 0 14px;display:grid;gap:var(--peer-gap); }
.help-section ol { margin:0;padding-left:22px;display:grid;gap:8px;line-height:1.5; }
.help-section p { margin:0; }
.help-credit { color:var(--muted);font-size:.875rem;padding:8px 2px 24px; }
.home-tiles.tiles-5,.home-tiles.tiles-6 { grid-template-columns:repeat(2,minmax(0,1fr)); }
.tiles-5 .home-tile:last-child { grid-column:1/-1; }
.home-tile .tile-caption { max-width:100%;min-height:1.25em; }
.home-tile .tile-caption>span:last-child { min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.home-tile .tile-context { line-height:1.35; }
.home-tile .tile-value { --tile-amount-size:30; }
.home-tile.tile-half .tile-value { --tile-amount-size:26; }
[data-home-style=rows] .home-tile .tile-value { --tile-amount-size:24; }
.home-tile .tile-value[data-money-full] { width:100%; }
.main-home .home-tiles.tiles-5,.main-home .home-tiles.tiles-6 { gap:var(--peer-gap);grid-auto-rows:minmax(0,1fr); }
.main-home .tiles-5 .home-tile,.main-home .tiles-6 .home-tile { min-height:96px;padding:10px 12px;gap:5px; }
.main-home [data-home-style=details] .home-tile { min-height:138px;gap:5px; }
.main-home [data-home-style=details] .tile-facts { display:grid;gap:4px;width:100%; }
.main-home [data-home-style=details] .tile-meta { display:none; }
.home-tile .tile-facts>span { display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:baseline; }
.home-tile .tile-facts>span>span { overflow:hidden;text-overflow:ellipsis; }
.home-tile .tile-facts b { font-size:.75rem;max-width:100%;min-width:0; }
@media(max-width:360px) {
 .main-home .tiles-5 .home-tile,.main-home .tiles-6 .home-tile { padding:8px 6px; }
 .home-tile.tile-half .tile-value { --tile-amount-size:24; }
 .main-home [data-home-style=details] .home-tile { min-height:132px;padding:10px; }
 .home-tile.tile-half .tile-facts>span { grid-template-columns:minmax(0,1fr);gap:0; }
 .home-tile.tile-half .tile-facts b { justify-self:start; }
}
@media(max-height:740px) {
 .main-home .tiles-5 .home-tile,.main-home .tiles-6 .home-tile { min-height:84px;gap:3px; }
 .main-home [data-home-style=details] .home-tile { min-height:130px; }
}

/* B1.1: hierarchy inside existing pick/list cards; geometry remains shared. */
.plan-category { display:block; grid-column:1/-1; min-width:0; }
.plan-category>strong { display:block; font-weight:600; white-space:normal; }
.plan-subcategory { display:block; margin-top:5px; padding-left:16px; font-size:.82rem; font-weight:400; color:var(--muted); overflow-wrap:anywhere; }
.pick-button>.plan-category { grid-column:1/-1; grid-row:auto; display:block; }

/* B1.2: isolated, single-column plan cards; shared palette and spacing. */
.plan-review-card { display:flex; flex-direction:column; align-items:stretch; gap:12px; width:100%; min-width:0; margin-block:var(--peer-gap); padding:20px; border:0; border-radius:22px; background:var(--white); color:var(--ink); text-align:left; }
.plan-review-card>* { display:block; width:100%; min-width:0; max-width:100%; white-space:normal; word-break:normal; overflow-wrap:break-word; }
.plan-review-card>strong { font-size:1rem; font-weight:500; }
.plan-review-label { color:var(--muted); font-size:.82rem; }
.plan-card-action { display:block; margin-top:4px; color:var(--blue); font-size:.82rem; }
.plan-list-card { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:pan-y; }
.plan-list-card .plan-category { margin-top:8px; }
.plan-horizon { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-top:26px; }
.plan-horizon select { width:auto; max-width:100%; min-height:44px; margin:0; padding:8px 12px; background:transparent; }

/* B1.2.1: plan content must not inherit the shared arrow column / horizontal row. */
.list-button.plan-list-card { display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start; gap:6px; }
.list-button.plan-list-card>*,.list-button[data-plan-due]>* { width:100%; min-width:0; max-width:100%; flex-shrink:1; white-space:normal; word-break:normal; overflow-wrap:break-word; }
.list-button.plan-list-card .plan-category { margin-top:8px; }
.pick-button#plan-category { display:flex; flex-direction:column; align-items:stretch; }
.pick-button#plan-category>.plan-category { display:block; width:100%; min-width:0; grid-column:auto; grid-row:auto; place-items:normal; text-align:left; white-space:normal; }
.pick-button#plan-category .plan-category>strong { display:block; width:100%; text-align:left; overflow:visible; text-overflow:clip; white-space:normal; word-break:normal; overflow-wrap:break-word; }
.pick-button#plan-subcategory { grid-template-columns:minmax(0,1fr); }
.pick-button#plan-subcategory>.plan-subcategory { grid-column:1; grid-row:2; white-space:normal; word-break:normal; overflow-wrap:break-word; }
.list-button[data-plan-due] { flex-direction:column; align-items:stretch; }

/* C1: static chrome does not summon the iOS copy menu; personal text does. */
body { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
input,textarea,[contenteditable=true],.full-note,.activity-comparison span {
 -webkit-user-select:text; user-select:text; -webkit-touch-callout:default;
}
.note-viewer .note-content { max-height:none; overflow:visible; margin-bottom:var(--group-gap); }
.note-preview { width:100%; margin-block:var(--peer-gap); }

/* D1: one bounded editable region, one textarea scroller, same island controls. */
.note-field { display:grid; grid-template-rows:44px minmax(0,1fr); min-height:0; overflow:hidden; border:1px solid var(--line); border-radius:16px; padding:0 var(--peer-gap) var(--peer-gap); background:var(--white); }
.note-tools { display:flex; justify-content:flex-end; align-items:center; min-width:0; }
.note-tools .field-count { margin-right:auto; }
.note-expanded .value-form { grid-template-rows:minmax(0,1fr); }
.note-expand { color:var(--blue); }
.note-editor .note-field textarea.field-input { width:100%; min-width:0; min-height:0; height:100%; padding:4px 0; }
.sheet.note-expanded .sheet-head { height:44px; min-height:44px; padding-block:0; }
.sheet.note-expanded .sheet-body { padding-top:calc(44px + env(safe-area-inset-top) + 10px + var(--peer-gap)); }

/* D1: related object commands are peers; operations form a separate group. */
.object-actions { display:flex; flex-wrap:wrap; align-items:stretch; gap:var(--peer-gap); margin-block:var(--group-gap); }
.object-actions>* { margin:0; }
.sheet-body>h3+.entity-history { margin-top:var(--peer-gap); }
.subcategory-results { gap:var(--peer-gap); margin-block:var(--group-gap); }

/* D1 measured density: keep labels and amounts, reveal extra facts in details. */
.main-home .home-tiles .home-tile { min-height:0; max-height:100%; overflow:hidden; padding:var(--peer-gap); gap:4px; }
.main-home [data-density=compact] .home-tile { padding:8px; gap:3px; }
.main-home [data-density=compact] .tile-facts,.main-home [data-density=compact] .tile-meta,
.main-home [data-density=tight] .tile-facts,.main-home [data-density=tight] .tile-meta,.main-home [data-density=tight] .tile-context,
.main-home [data-density=tiny] .tile-facts,.main-home [data-density=tiny] .tile-meta,.main-home [data-density=tiny] .tile-context { display:none; }
.main-home [data-density=tight] .home-tile,.main-home [data-density=tiny] .home-tile { padding:4px 8px; gap:2px; }
.main-home [data-density=tight] .tile-caption,.main-home [data-density=tiny] .tile-caption { font-size:.75rem; line-height:1.2; }
.main-home [data-density=tight] .tile-value { --tile-amount-size:20; font-size:20px; }
.main-home [data-density=tiny] .tile-value { --tile-amount-size:16; font-size:16px; }
@media(min-width:761px) and (max-height:480px) {
 .main-home .home-screen { display:grid; grid-template-columns:minmax(150px,.8fr) minmax(0,1.2fr); grid-template-rows:44px minmax(0,1fr); }
 .main-home .dual-summary { grid-column:1; grid-row:1/3; }
 .main-home .home-status-row { grid-column:2; grid-row:1; }
 .main-home .home-tiles { grid-column:2; grid-row:2; height:100%; }
 .main-home .home-screen:has(.draft-home) { grid-template-rows:44px 36px minmax(0,1fr); }
 .main-home .home-screen:has(.draft-home) .dual-summary { grid-row:1/4; }
 .main-home .home-screen:has(.draft-home) .home-tiles { grid-row:3; }
 .main-home .draft-home { grid-column:2; grid-row:2; }
 .main-home .big { font-size:1.5rem; }
 .main-home .free-row strong { font-size:1.2rem; }
}

.main-home [data-density=tight] .tile-value.tile-status,.main-home [data-density=tiny] .tile-value.tile-status { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

@media(max-height:480px) {
 .sheet.note-editor .sheet-head { height:44px; min-height:44px; padding-block:0; }
 .sheet.note-editor .sheet-body { padding-top:calc(44px + env(safe-area-inset-top) + 10px + var(--peer-gap)); }
}

/* G1 levels share the existing notice island; required warnings never time out. */
.feedback-notice[data-level=system]:not(.feedback-required) { padding:6px 8px 6px 12px; gap:8px; border-radius:22px; }
.feedback-notice[data-level=system]:not(.feedback-required) .feedback-copy { font-size:.8125rem; }
.feedback-notice[data-level=system]:not(.feedback-required) .feedback-mark { flex-basis:18px; }
.feedback-notice[data-level=system]:not(.feedback-required) .feedback-mark .app-icon { width:18px; height:18px; }
.feedback-financial { cursor:pointer; border:1px solid var(--line); }
.feedback-financial:focus-visible { background:var(--keyboard-state); text-decoration:underline; }
.financial-receipt { margin-top:var(--group-gap); }
.financial-receipt dl { margin-bottom:0; }
.palette-swatches { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:4px; margin-block:var(--peer-gap); }
.palette-swatches>span { height:24px; min-width:0; border-radius:8px; border:1px solid var(--line); }

.feedback-required { touch-action:pan-y; overscroll-behavior:contain; }

/* A2: system-area anchored feedback; long messages retain native vertical scroll. */
:root { --feedback-safe-top:env(safe-area-inset-top,0px); }
.feedback-notice.feedback-scrollable { touch-action:pan-y pinch-zoom; overscroll-behavior:contain; }

/* P1.2: scoped calendar geometry, existing FinRate surfaces/type/color tokens. */
.payment-calendar table { width:100%; table-layout:fixed; border-collapse:collapse; }
.payment-calendar th,.payment-calendar td { padding:0; text-align:center; vertical-align:top; }
.payment-calendar .text-button { min-width:0; width:100%; padding:6px 0; min-height:44px; }
.payment-calendar small { display:block; overflow-wrap:anywhere; }
.payment-calendar [aria-pressed=true] { background:var(--soft); border-radius:16px; }

/* P2: constrain only debt-owned lists; reuse peer spacing and existing cards. */
[data-debt-list] { display:grid; grid-template-columns:minmax(0,1fr); gap:var(--peer-gap); }
[data-debt-list]>.list-button { min-width:0; margin:0; }

/* The operation tab and chooser share one outline, size and paint calculation. */
.operation-edge { position:fixed; right:0; top:calc(50% - 42px); width:18px; height:84px; min-height:0; border:0; padding:0; border-radius:10px 0 0 10px; background:var(--action); opacity:.84; z-index:9; touch-action:none; display:grid; place-items:center; }
.operation-edge::before { content:''; position:absolute; inset:0 0 0 -26px; }
.operation-edge>span { width:3px; height:36px; border-radius:3px; background:#fff; opacity:.85; pointer-events:none; }
.operation-edge[data-side=left] { left:0;right:auto;border-radius:0 10px 10px 0; }
.operation-edge[data-side=left]::before { inset:0 -26px 0 0; }
.operation-edge[hidden],.edge-preview[hidden] { display:none; }
.edge-preview,.sheet.operation-chooser { position:fixed; right:0; left:auto; top:50%; width:min(350px,calc(100% - 20px)); margin:0; padding:2px; border:0; border-radius:var(--edge-round,28px); background:var(--action); box-shadow:var(--island-shadow); clip-path:inset(var(--edge-crop,0px) 0 var(--edge-crop,0px) 0 round var(--edge-round,28px)); transform:translate(var(--edge-shift,0px),-50%); animation:none; touch-action:none; }
.edge-preview[data-side=left],.sheet.operation-chooser[data-side=left] { left:0; right:auto; }
.edge-preview { z-index:10; pointer-events:none; height:220px; color:var(--ink); }
.sheet.operation-chooser { max-height:calc(var(--viewport-height,100dvh) - 40px); overflow:hidden; }
.sheet.operation-chooser::backdrop { background:transparent; }
.edge-preview::before,.sheet.operation-chooser::before { content:''; position:absolute; inset:2px; background:var(--white); border-radius:var(--edge-inner-round,26px); clip-path:inset(0 0 0 var(--edge-blue,0px)); pointer-events:none; }
.edge-preview[data-side=left]::before,.sheet.operation-chooser[data-side=left]::before { clip-path:inset(0 var(--edge-blue,0px) 0 0); }
.edge-preview>*:not(.edge-stripe),.sheet.operation-chooser>.sheet-head,.sheet.operation-chooser>.sheet-body { opacity:var(--edge-copy,1); }
.edge-stripe { position:absolute; z-index:3; top:calc(50% - 18px); left:7px; width:3px; height:36px; border-radius:3px; background:#fff; opacity:var(--edge-stripe,0); pointer-events:none; }
[data-side=left]>.edge-stripe { left:auto; right:7px; }
.edge-preview-head { position:relative; margin:12px 12px 0; min-height:62px; padding:16px 12px; border-radius:28px; background:var(--white); box-shadow:var(--island-shadow); font-size:1.2rem; font-weight:600; }
.edge-preview>.operation-choices { position:relative; margin:14px 12px; }
.edge-preview .operation-choices>div { display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; min-width:0; min-height:104px; padding:16px 6px; background:var(--field); border-radius:22px; font-size:.88rem; text-align:center; }
.edge-preview .app-icon { width:30px; height:30px; }
.sheet.operation-chooser .sheet-head { background:var(--white); backdrop-filter:none; }
.sheet.operation-chooser .sheet-body { position:relative; }
.sheet.operation-chooser .operation-choices { pointer-events:auto; }
@media(max-width:360px) { .edge-preview .operation-choices>div { min-height:92px; font-size:.8rem; } }

/* D1: both launch points finish at the same safe, symmetric panel. */
.edge-preview,.sheet.operation-chooser,.edge-preview[data-side=left],.sheet.operation-chooser[data-side=left] { left:50%; right:auto; width:min(480px,calc(100% - 2 * var(--island-gutter))); transform:translate(calc(-50% + var(--edge-shift,0px)),-50%); }
.sheet.operation-chooser.top-chooser { top:var(--chooser-top,84px); max-height:calc(var(--viewport-height,100dvh) - var(--chooser-top,84px) - var(--peer-gap)); transform:translateX(-50%) translate(var(--top-dx,0px),var(--top-dy,0px)) scale(var(--top-sx,1),var(--top-sy,1)); transform-origin:center; clip-path:none; }
.sheet.top-chooser::before { opacity:var(--top-inner,1); }
.sheet.top-chooser .edge-stripe { display:none; }

/* G1: independent palette axis. No selector in this file recolours neutral. */
:root[data-palette=color] {
 --palette-1:#06141B; --palette-2:#11212D; --palette-3:#253745;
 --palette-4:#4A5C6A; --palette-5:#9BA8AB; --palette-6:#CCD0CF;
 --chrome-canvas:light-dark(#CCD0CF,#06141B);
 --ink:light-dark(#06141B,#CCD0CF);
 --muted:light-dark(#253745,#9BA8AB);
 --white:light-dark(#e7ebea,#11212D);
 --soft:light-dark(#CCD0CF,#253745);
 --field:light-dark(#CCD0CF,#253745);
 --line:light-dark(#4A5C6A,#9BA8AB);
 --island:light-dark(#9BA8ABf2,#11212Df2);
 --feedback-bg:var(--white);
 --menu-surface:var(--white);
 --menu-selected:var(--soft);
 --keyboard-state:var(--soft);
 --control-pressed:var(--soft);
 --archive-selected:var(--soft);
 /* Same semantic hues, darker light-mode text for the darker blue-grey island. */
 --blue:light-dark(#003568,#9bc3ff);
 --expense:light-dark(#701b27,#ff858d);
 --income:light-dark(#084526,#78d5a2);
 --transfer:light-dark(#483605,#ebcb71);
 --credit-ink:light-dark(#4f256b,#d8b6f0);
 --shadow:0 10px 28px light-dark(#4A5C6A33,#06141B70);
 --island-shadow:0 12px 28px light-dark(#4A5C6A40,#06141Bb3);
}
:root[data-palette=color] .scroll-end::before,:root[data-palette=color] .scroll-start::before { background:var(--white); }
:root[data-palette=color] #app::before,:root[data-palette=color] .sheet.large::before { background:linear-gradient(to bottom,light-dark(#CCD0CF66,#06141B66),light-dark(#CCD0CF22,#06141B22)); }
@media(max-width:760px) {
 :root[data-palette=color] :is(.page-title h1,.floating-heading>span,main>h1:not(.sr-only),.floating-heading button) { background:light-dark(#CCD0CFc7,#06141Bc7); }
}
@media(prefers-reduced-transparency:reduce) {
 :root[data-palette=color] { --island:light-dark(#9BA8AB,#11212D); }
 :root[data-palette=color] #app::before,:root[data-palette=color] .sheet.large::before { background:var(--canvas); }
}

<section class="help-section"><h2>Долги</h2><details><summary>Как записать долг и не изменить деньги дважды?</summary><div><p>Меню → Долги → «Я должен» или «Мне должны» → «+». «Долг уже существует» создаёт обязательство без движения денег. «Деньги передаются сейчас» записывает ровно один реальный заём на выбранном собственном денежном счёте. Тело займа и его возврат не относятся к обычным доходам и расходам. Кредитные счета B1 используются отдельно.</p><p>В карточке можно явно связать ранее записанный loan/repayment-факт без второй проводки. Переводы «Другому человеку» не переклассифицируются: для уже возникшего долга выбирайте «Долг уже существует», не повторяйте выдачу денег. Исторический расход при этом сохраняется; его переклассификация требует отдельного согласованного решения.</p></div></details><details><summary>Как вернуть часть, исправить или отменить возврат?</summary><div><p>Откройте долг → «Вернуть долг» или «Получить возврат». Проверьте реальные сумму, дату и счёт. Частичный возврат оставляет остаток и прежний срок. В истории движения откроется та же запись, что и в «Операциях»: «Изменить» и «Отменить запись» пересчитывают долг вместе с деньгами. Переплата и смена направления при связанных фактах запрещены. Несохранённую форму можно оставить черновиком без изменения денег.</p><p>В архив можно убрать только погашенный долг. Отмена окончательного возврата открывает остаток и возвращает долг из архива. Прощение и списание без возврата пока не поддерживаются.</p></div></details><details><summary>Где срок и как избежать двойного учёта?</summary><div><p>«Я должен» с датой виден в «Платежи → К оплате» как «Возврат долга». Возврат подтверждается отдельно: в массовую оплату расходов он не входит. Без срока долг виден в своём разделе, но не получает выдуманную дату текущего месяца. «Мне должны» остаётся требованием, пока деньги не получены.</p><p>При совпадении суммы и срока с планом, кредиткой или другим долгом FinRate предлагает сверить записи. «Это другое обязательство» разрешает только осознанный раздельный учёт. Приложение не угадывает связь и не объединяет записи. Если это одно обязательство, не создавайте дубль; исправьте исходную запись. Новые совпадения отмечаются в карточке долга и в «Свободных деньгах».</p></div></details><details><summary>Долги сохранятся в копии и при обновлении?</summary><div><p>Долги и связи входят в ту же защищённую копию. Старые копии P1.2 открываются без сброса; все три режима очистки A2 удаляют долговую информацию вместе с финансовыми данными. До обновления сохраните и проверьте внешнюю копию.</p><p>Откат кода к P1.2 не откатывает финансовые данные: старая сборка не рассчитывает личные долги. Для полного возврата состояния нужна отдельная копия до P2, с осознанной заменой данных. Офлайн, PIN и шифрование сохраняют прежнюю механику.</p></div></details></section>
<section class="help-section"><h2>Пароль и вход</h2><details><summary>Как изменить защиту без потери данных?</summary><div><p>Меню → Настройки → Пароль и вход. Изменение основного пароля, PIN и режима входа подтверждается основным паролем или ключом восстановления. Смена основного пароля сохраняет PIN, recovery и финансовую историю. Для старых файлов нужен прежний секрет; смена пароля не отзывает ранее раскрытый ключ данных.</p><p>PIN из 4 или 6 цифр действует только в этом браузере. После пяти неверных попыток войдите основным паролем или ключом. Это локальный лимит приложения, не аппаратная защита устройства. «Открывать без проверки» сохраняет шифрование копий, но позволяет любому пользователю этого браузера открыть данные.</p></div></details><details><summary>Что происходит при уходе из приложения?</summary><div><p>FinRate скрывает интерфейс и очищает секретные поля. Незавершённое подтверждение смены защиты отменяется; начатая подтверждённая запись завершается целиком либо откатывается. Остальные формы сохраняют прежнюю механику черновиков и автоблокировки. При изменении защиты соседнее открытое окно этого хранилища требует повторного входа.</p><p>Срок автоблокировки действует при пароле или PIN. «Никогда» не удаляет пароль, но оставляет доступ открытым после короткого возврата. iOS может завершить PWA; сохранение процесса и вид снимка в переключателе приложений не гарантируются.</p></div></details><details><summary>Можно использовать «Пароли» iPhone и Face ID?</summary><div><p>Поля основного пароля помечены для системного автозаполнения; сохранение выбираете вы в менеджере паролей. FinRate не сохраняет пароль открытым и не отправляет его. PIN и recovery не предлагаются как основной пароль; браузер может применять собственные правила. При отсутствии подсказки вводите вручную. Safari и установленная PWA требуют отдельной проверки.</p><p>Отдельный биометрический вход FinRate пока не включён: безопасное получение ключа через WebAuthn PRF ещё требует испытаний на iPhone. Face ID в системном менеджере паролей подтверждает действие самого менеджера.</p></div></details></section>
<section class="help-section"><h2>Финансовая модель B1</h2><details open><summary>Фактический остаток и пять режимов свободных денег</summary><div><p>Фактический остаток — ваши собственные деньги. Кредитный долг не вычитается, неиспользованный лимит не прибавляется. Собственные средства, оставленные после возврата на кредитке, входят в остаток.</p><p>Период на Главной и в «Настройки → Финансовое планирование» общий и сохраняется сразу после выбора. При первом запуске выбран текущий месяц. Нажмите «Свободные деньги»: текущий месяц вычитает известные ещё не погашенные суммы и просрочки без будущей зарплаты. Прогноз на 2, 3 или 4 месяца включает остаток текущего месяца и следующие месяцы, а также настроенные ожидаемые доходы. «Все долги» вычитает уже возникшие учтённые долги независимо от срока, без будущих услуг и доходов. Отрицательное число показывает нехватку денег.</p><p>Прогноз учитывает непогашенные запланированные платежи выбранного горизонта. Личные долги «Я должен» учитываются по неоплаченному остатку; без срока — только в режиме «Все долги». Требования «Мне должны» не увеличивают прогноз до получения. Резервы ещё не подключены. Возможный дефицит до конечной даты показан отдельно.</p></div></details><details><summary>Как настроить доходы и избежать удвоения?</summary><div><p>Настройки → Финансовое планирование → «Добавить доход». Планы видны сразу, период расчёта находится внизу. Тап по плану открывает карточку с отдельным синим «Изменить» под каждым значением. Долгое нажатие открывает меню: «Дублировать», «Архивировать», «Удалить план». Можно выбрать пункт движением пальца и отпусканием или отдельным тапом. Копия не сохраняется до подтверждения; история, фактические доходы и связи в неё не копируются. Архив отключает будущие поступления и позволяет восстановить план без начисления за время паузы. При архивировании и удалении выберите, оставить прошлые поступления ожидаемыми или закрыть без поступления. Записанные операции сохраняются. Последовательно укажите сумму за одно поступление, категорию и подкатегорию, периодичность и счёт зачисления. Категории, подкатегории и счета общие с обычными операциями; создать недостающие можно прямо при выборе. Периодичность: каждый день, неделю, месяц или год. Начало учёта — день создания; прошлые даты автоматически не добавляются. Зарплату и аванс настройте как два дохода, без третьей полной зарплаты.</p><p>Любое поступление записывайте через «+ → Доход». Если есть незакрытые плановые поступления, выберите карточку либо «Другой доход». Если их нет — сразу откроется обычная форма. «Подтвердить по плану» записывает оставшуюся сумму на выбранный счёт сегодняшней датой. Через «Скорректировать» измените сумму, фактическую дату или счёт. При меньшей сумме укажите, ожидается ли остаток. Большая сумма целиком входит в факт, план будущих месяцев не меняется. Если доход уже записан, используйте «Связать с записанным доходом»: второго зачисления не будет.</p><p>Пропущенные поступления остаются отдельными карточками. «Закрыть без поступления» убирает только эту дату, комментарий необязателен. Следующие поступления сохраняются. История изменений плана сохраняется внутри защищённой базы, но её просмотр пока скрыт. Новые регулярные планы учитывают незакрытые задержанные поступления в прогнозах на 2–4 месяца; текущий месяц и «Все долги» будущие доходы не прибавляют. Если числа нет в месяце — последний день месяца, включая 29 февраля. Изменение расписания действует с текущей даты и не переписывает прежние даты и подтверждения. Удаление плана отключает будущее, сохраняя операции и прошлые незакрытые поступления.</p></div></details><details><summary>Что делать с возвратом на погашенную кредитку?</summary><div><p>Возврат уменьшает сначала долг исходной покупки, затем остальные долги. Излишек можно оставить собственными средствами на кредитке: следующие покупки сначала тратят их, затем кредит. Сам лимит банка не увеличивается. Возврат уменьшает расходы и не считается заработанным доходом.</p><p>Либо выберите дебетовый счёт и подтвердите, что излишек действительно переведён в дату операции. До реального перевода не подтверждайте зачисление. Если ещё не решили — «Сохранить черновик». Черновик не меняет показатели, сохраняется на устройстве, не блокирует карту или другие операции. Продолжить или удалить его можно в «Черновиках»; при завершении расчёт проверяется заново.</p><p>Обычное пополнение карты не может превышать долг. Нельзя отменить старую покупку так, чтобы её погашение превратилось в произвольную переплату; сначала исправьте связанные записи. Если возврат и реальный вывод сделаны в разные дни, сохраните возврат с вариантом «Оставить», затем запишите фактический перевод собственных средств на дебет отдельной датой.</p></div></details><details><summary>Меняются ли старые сроки при смене настроек карты?</summary><div><p>Нет. Новые правила применяются к новым покупкам. Срок уже записанной покупки сохраняется; его явное изменение показано в истории «было → стало». Погашение закрывает ближайшие сроки, просроченные — первыми. Выписка — контрольная информация, не второй долг. Проценты и банковские минимальные платежи не начисляются автоматически.</p></div></details><details><summary>Нужен ли сброс для B1?</summary><div><p>Автоматического сброса нет. Обычные совместимые документы R30 преобразуются при открытии с сохранением исходной защищённой версии перед первым сохранением. Неподдерживаемая переплата или долг без срока требуют отдельного разбора: база не стирается. До обновления сохраните защищённую копию. R30 не читает новый формат B1.</p></div></details></section><section class="help-section"><h2>С чего начать</h2><ol><li>Создайте защищённую базу и сохраните ключ восстановления отдельно от резервной копии.</li><li>В разделе «Счета и кошельки» добавьте ваши реальные счета и укажите их текущие остатки.</li><li>Записывайте покупки, поступления и переводы через кнопку операций. Выберите дату, счёт, сумму и при желании категорию.</li><li>Сделайте защищённую копию через «Данные и синхронизация» и проверьте, что файл сохранился.</li></ol><p>Суммы с подписью «Пример» служат подсказкой: в поле ещё ничего не введено.</p></section>
<section class="help-section"><h2>Счета и остатки</h2><details><summary>Что вводить при добавлении счёта?</summary><div><p>Введите сумму, которая находится на счёте сейчас. Это исходная точка учёта. Для кредитной карты отдельно вводится уже существующий долг банку положительным числом без знака минус.</p><p>«Начальный остаток» в карточке показывает ту исходную точку, а «Текущий остаток» учитывает все записанные после неё операции.</p></div></details><details><summary>Как исправить остаток?</summary><div><p>Откройте счёт → «Редактировать» → «Изменить остаток». Для обычного счёта текущая сверка создаст корректировку разницы, которая не считается доходом или расходом. Изменение начального остатка пересчитает текущий результат.</p><p>На кредитном счёте новый долг добавляется расходом с датой и сроком возврата; не создавайте его сверкой остатка. Пополнение долга выполняйте переводом на кредитный счёт.</p></div></details></section>
<section class="help-section"><h2>Кредитная карта</h2><details open><summary>Как завести карту с уже существующим долгом?</summary><div><ol><li>Выберите кредитный тип и укажите лимит банка.</li><li>Введите сумму, которую уже должны банку, без знака минус. Пустое поле означает, что долга пока нет.</li><li>Выберите правило срока новых покупок: по месяцам, по числу дней либо по выписке.</li><li>На следующем шаге распределите <strong>весь</strong> текущий долг: для каждой части укажите сумму и точный срок по выписке или месяц прежней покупки. Нажатие на «Осталось распределить» подставляет остаток в сумму следующей части, но не добавляет её и не сохраняет счёт. Сохранение доступно, когда осталось распределить ноль.</li></ol><p>Лимит — сколько банк разрешает занять. Долг — сколько уже занято. Доступная сумма меняется при покупках и пополнениях; долг помечен фиолетовым.</p></div></details><details><summary>Я забыл расход из прошлого месяца. Как его добавить?</summary><div><p>Создайте обычную операцию «Расход», выберите кредитную карту и поставьте фактическую дату старой покупки. При режиме по месяцам или дням срок этой покупки рассчитается от её даты. В режиме выписки укажите точный срок возврата в поле операции. Долг попадёт в соответствующий срок; повторно вводить всю исходную сумму не нужно.</p><p>Перед переносом из R30 долг без сроков необходимо распределить в R30. После переноса сверьте старые даты с выпиской: B1 фиксирует то, что рассчитывала R30 на момент переноса, и не восстанавливает утраченные старые условия.</p></div></details><details><summary>Как считается срок покупок?</summary><div><p>При правиле «По месяцам» покупки одного календарного месяца получают одинаковый срок — конец выбранного месяца после месяца покупки. Например, при правиле «до конца третьего месяца» покупки октября надо вернуть до 31 января. При правиле «Точное число дней» срок считается от даты каждой покупки. При режиме «По выписке» срок указываете сами.</p><p>Настоящая дата банка может зависеть от условий карты. Проверьте расчёт по выписке и при необходимости укажите её дату прямо в операции.</p></div></details><details><summary>Как погасить долг полностью или частично?</summary><div><p>Сделайте перевод с наличных или другого счёта <strong>на кредитную карту</strong>. Пополнение гасит сначала самый ранний непогашенный срок, затем следующий. Если в октябре нужно вернуть 10 000 ₽, а в ноябре ещё 10 000 ₽, перевод 7 000 ₽ оставит октябрьский долг 3 000 ₽. Перевод 15 000 ₽ закроет октябрь и уменьшит ноябрьский долг до 5 000 ₽.</p><p>Перевод не является доходом. Обычный перевод не может превышать общий долг. Собственные средства возникают только из излишка подтверждённого возврата покупки.</p></div></details><details><summary>Что делать с переводом с кредитки или комиссией?</summary><div><p>Выберите срок возврата кредитных средств в операции, когда она использует лимит. Банк может не давать льготный период на такие операции. Сумму платежа по выписке можно дополнительно уточнить в карточке счёта; это уточнение не заменяет распределение долга по срокам.</p></div></details></section>
<section class="help-section"><h2>Платежи</h2><details><summary>Как запланировать и оплатить?</summary><div><p>«Платежи» → «Запланированные» → «+». Укажите название, сумму, дату, повторение, категорию и счёт. «К оплате» показывает выбранный месяц и прежние неоплаченные сроки. План не меняет фактический остаток.</p><p>Для переменного платежа сумма плана — ориентир. По умолчанию выбрано «Оплачено полностью»: подтверждённая фактическая сумма закрывает только этот период, даже если она меньше или больше ориентира. «Частичная оплата» оставляет обязательство открытым. Если части достигли ориентира, явно уточните сумму этого периода либо выберите полную оплату; скрытого увеличения нет. Следующий месяц сохраняет прежний ориентир.</p><p>Фиксированная сумма остаётся обязательством: 20 000 из 30 000 оставляет 10 000. Для превышения сначала явно измените сумму выбранного экземпляра. Каждый факт — один обычный расход в «Оплаченных» и «Операциях». Исправление/отмена пересчитывает остаток; отмена финальной части снова открывает переменный период.</p></div></details><details><summary>Как подтвердить несколько оплат?</summary><div><p>«К оплате» → «Выбрать несколько» → отметьте обязательства → «Продолжить». Откройте каждую строку для проверки настоящих суммы, даты, счёта и результата переменной оплаты. Данные сохраняются внутри проверки; возврат предлагает продолжить редактирование или явно выйти без сохранения.</p><p>Только «Подтвердить оплаты» создаёт расходы. Вся группа записывается целиком либо не записывается: ошибка места, нехватка денег или конфликт не оставляет половину группы. Повторное подтверждение не создаёт второй расход. Банковские автоплатежи сами не выбираются.</p></div></details><details><summary>Что меняют команды и календарь?</summary><div><p>«Только этот платёж» изменяет один экземпляр. «Этот и будущие» меняет неоплаченные условия с указанной даты расписания, сохраняя периоды с историей оплат и исходную регулярность. «Перенести» меняет дату одного обязательства, сохраняя его остаток и связи. «Приостановить на этот месяц» пропускает выбранный неоплаченный экземпляр: он не входит в «К оплате» и прогноз и не переносится на следующий месяц. При частичной оплате такая пауза недоступна.</p><p>Бессрочная пауза и возобновление сохраняются; пропущенное во время неё не начисляется задним числом. В коротком месяце используется последний день, затем возвращается исходный. Досрочная оплата не меняет календарь. В «Запланированных» можно выбрать список или календарь и открыть ту же карточку события. Переключение вида не создаёт новых обязательств.</p></div></details><details><summary>Как проверить банковский автоплатёж?</summary><div><p>FinRate не подключён к банку. Карточка показывает предполагаемый счёт и доступную сумму по уже записанным данным. Для будущего срока это оценка, не обещание результата. «Не прошло» и неизвестный результат сохраняют только отметку и историю; деньги не уменьшаются. Лишь подтверждение настоящего списания создаёт расход. Позднее подтвердить его можно в том же обязательстве.</p><p>Погашение кредитной карты выполняйте прежним переводом B1, не новым расходом. Изменение фактического счёта оплаты не меняет предполагаемый счёт в шаблоне.</p></div></details></section>
<section class="help-section"><h2>Операции и категории</h2><details><summary>Расход, доход или перевод?</summary><div><p>Покупка и комиссия — расход; заработанные или полученные деньги — доход. Перемещение между своими счетами, включая погашение кредитки, — перевод: деньги списываются с одного и поступают на другой, без нового дохода или расхода.</p><p>В операции можно поставить прошлую дату, добавить примечание и распределить покупку по нескольким категориям.</p></div></details><details><summary>Как работать с категориями и подкатегориями?</summary><div><p>Откройте «Категории», выберите тип операций и нажмите на категорию: под ней раскроется список подкатегорий. Кнопка создания находится над списком. Значок редактирования рядом с категорией открывает её настройки; подкатегорию можно открыть прямо из списка. Для доходов и расходов списки раздельные.</p></div></details><details><summary>Как найти и исправить запись?</summary><div><p>Откройте «Операции» или поиск, найдите запись по дате и названию, затем используйте действия в её карточке. Изменения отражаются в остатках и истории. Возврат покупки привязывается к исходному расходу; отмена и архивирование доступны в соответствующих карточках, когда это позволяет состояние записи.</p></div></details></section>
<section class="help-section"><h2>Данные и доступ</h2><details><summary>Где хранятся мои данные?</summary><div><p>База хранится на этом устройстве в браузере. Пароль защищает её локально. Очистка данных сайта может удалить базу, поэтому регулярно сохраняйте защищённую копию отдельно. Раздел «Данные и синхронизация» позволяет создать или восстановить такую копию; автоматической облачной синхронизации здесь нет.</p></div></details><details><summary>Что делать, если забыл PIN?</summary><div><p>Войдите с основным паролем или ключом восстановления. PIN — быстрый способ входа на этом устройстве; он не заменяет пароль и резервную копию.</p></div></details></section>
<section class="help-section"><h2>Главная и меню операций</h2><details><summary>Как настроить блоки?</summary><div><p>Нажмите «Настроить блоки» на Главной. Доступны 1–6 блоков и три прежних вида: числа, подробности и строки. Блоки помещаются на экран без отдельной прокрутки; при нехватке высоты второстепенные подписи сокращаются, подробности открываются по нажатию на блок. Долгое нажатие на «Главная» в нижней панели и настройка через «Настройки» также сохранены.</p></div></details><details><summary>Где создать операцию?</summary><div><p>Верхний «+» и боковая ручка открывают одно меню «Новая операция» с расходом, доходом и переводом. Верхнее меню располагается под заголовком, боковое — по центру с равными отступами. Закрыть можно крестиком, касанием снаружи или возвратом; боковую ручку можно потянуть обратно.</p></div></details></section><section class="help-section"><h2>Примечания и ввод</h2><details><summary>Как прочитать и изменить примечание?</summary><div><p>Нажмите «Примечание · Просмотреть» в карточке операции или счёта. Полный текст открывается без клавиатуры; его можно выделить и скопировать. «Редактировать» открывает общий редактор с чёткой рамкой и кнопкой со встречными диагональными стрелками: она разворачивает и сворачивает область текста, сохраняя текст, курсор и прокрутку. «Сохранить» принимает текст. «Отмена» при изменениях предлагает продолжить, сохранить или выйти без сохранения. В форме изменения остаются в черновике до сохранения самой формы. Прежние значения в истории доступны только для чтения. Редактор занимает пространство над клавиатурой; прокручивается сам текст. Короткий свайп вниз в начале текста или касание свободного места у счётчика скрывает клавиатуру без сохранения. Для продолжения коснитесь нужного места текста. Панель со стрелками и галочкой над клавиатурой принадлежит iOS. Штатного способа убрать её в PWA нет; она не сохраняет примечание. В развёрнутом режиме счётчик помещается в строку кнопки, освобождая место для текста.</p></div></details><details><summary>Как завершить ввод суммы?</summary><div><p>Введите сумму вместо выделенного значения и нажмите «Готово». Это принимает поле, но не проводит операцию. Дробную часть можно вводить через запятую или точку.</p></div></details></section><section class="help-section"><h2>Оформление и уведомления</h2><details><summary>Как включить цветную палитру?</summary><div><p>Настройки → Внешний вид → «Цветовая палитра»: Нейтральная или Цветная. Отдельная «Тема» задаёт Как в системе, Светлая или Тёмная. Сохраните настройки. В режиме «Как в системе» оттенки меняются вместе с устройством без перезагрузки. Цвета «Фактического остатка» и «Свободных денег» выбираются отдельно, прежние значения сохраняются.</p><p>В старых копиях без выбора палитры используется Нейтральная. После повторного входа восстанавливается сохранённый выбор; до расшифровки базы при новом запуске применяется нейтральное оформление.</p></div></details><details><summary>Чем отличаются уведомления?</summary><div><p>Финансовое сообщение появляется после подтверждённой записи. Тап открывает снимок именно сохранённого действия: тип, сумму, счёт и дату. Изменить запись из сообщения нельзя. В подробностях фон заблокирован; крестик или тап снаружи закрывают их. Свайп вверх убирает компактное сообщение. Если подлинных подробностей операции нет, показывается обычное системное подтверждение.</p><p>Системные сообщения компактны, находятся под верхним островом и исчезают автоматически. Очередь не выполняет финансовых действий повторно. Сообщения внутри открытого FinRate не являются push и не доставляются при закрытом приложении.</p></div></details><details><summary>Как отключить уведомления?</summary><div><p>В Настройках можно независимо отключить финансовые или системные уведомления, либо выключить «Обычные уведомления» целиком. Две частные настройки сохраняются при общем отключении. Ошибки сохранения и обязательные предупреждения безопасности остаются доступными. Ошибка записи не исчезает по таймеру: проверьте данные и повторите явно, пока исходная форма открыта. Текст формы сохраняется. Блокировка убирает чувствительные сообщения и подробности.</p></div></details></section><section class="help-section"><h2>Очистка и защищённые копии</h2><details><summary>Три режима очистки</summary><div><p>Меню → Данные и синхронизация → Сброс данных. «Очистить финансовые данные» удаляет счета, операции, планы, черновики, историю и локальные страховки, сохраняя текущие категории, оформление и защиту. «Очистить данные и категории» дополнительно оставляет пустой каталог и начальное оформление; пароль, ключ, PIN и время автоблокировки сохраняются. «Полный сброс FinRate» удаляет всю локальную базу и защиту входа.</p><p>До удаления нужно выбрать актуальный внешний файл и проверить его основным паролем или ключом восстановления; PIN недостаточен. Затем самостоятельно подтвердить сохранение файла в «Файлах» и ввести указанную фразу. Без проверенного файла продолжения нет. Отдельно сохранённые копии не удаляются. Откат версии приложения не возвращает удалённые данные.</p></div></details><details><summary>Что означает проверка копии?</summary><div><p>Приложение проверяет текущий контейнер перед экспортом. Сообщение о готовности не доказывает сохранение файла в «Файлах» — проверьте его самостоятельно. Открытие по паролю проверяет только этот способ, а открытие recovery — только ключ восстановления. Второй способ можно проверить отдельно, без применения восстановления.</p><p>Историческая страховочная версия выгружается как исходный файл без обещания проверки чужим текущим ключом. Старые копии остаются на прежнем секрете. Смена пароля не является отзывом ранее известного ключа данных; новой ротации ключей здесь нет.</p></div></details></section><footer class="help-credit">Разработчик FinRate — Максим Кравченко.</footer></div>`}var Lp="p2-debts01",st=document.getElementById("app"),ri=mu(),Le=new co(ri);st.dataset.build=Lp;var nn="Главная",So="",_p=!1,ii=!1,En=null,Gt=null,yc=!1,ni,Gn=!1,La=

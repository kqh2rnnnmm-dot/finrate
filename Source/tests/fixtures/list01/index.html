.filter-group .filter-date-error { color:var(--expense); margin:10px 0 0; }
.filter-date-error:empty { display:none; }
.filter-check { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:48px; padding:8px 0; line-height:1.3; font-size:.9375rem; color:var(--ink); }
.filter-check span { min-width:0; overflow-wrap:anywhere; }
.filter-check input { width:22px; height:22px; min-height:0; flex-shrink:0; accent-color:var(--action); margin:0; padding:0; appearance:auto; -webkit-appearance:auto; }
.filter-all { background:transparent; color:var(--muted); min-height:44px; border:0; padding:8px 0; text-align:left; }
.filter-all[aria-pressed=true] { color:var(--blue); font-weight:600; }
.filter-group summary { display:flex; align-items:center; gap:8px; min-height:44px; font-size:1.0625rem; font-weight:600; list-style:none; color:var(--ink); }
.filter-group summary::-webkit-details-marker { display:none; }
.filter-group summary span { margin-left:auto; color:var(--muted); font-weight:400; font-size:.82rem; min-width:0; }
.filter-group summary svg { width:18px; height:18px; transform:rotate(90deg); }
.filter-group details[open] summary { margin-bottom:10px; }
.filter-group details[open] summary svg { transform:rotate(-90deg); }
.filter-actions { display:grid; gap:8px; }
.filter-actions button { min-height:52px; border:0; border-radius:20px; background:transparent; color:var(--blue); padding:12px; }
.filter-actions .filter-apply { background:var(--action); color:#fff; font-weight:600; }
.filter-search-summary { display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; min-height:48px; margin:0 0 16px; padding:12px 16px; border:0; border-radius:20px; background:var(--soft); color:var(--ink); text-align:left; font-size:.875rem; }
</style></head>
